name: Deploy ICLABS-PRAKTIKUM to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            # Sesuaikan nama folder jika berbeda (contoh: praktikum atau iclabs-praktikum)
            cd /var/www/iclabs.fikom.umi.ac.id/production/praktikum

            # 1. Tarik pembaruan commit dari branch main
            git fetch origin main
            git reset --hard origin/main

            # 2. Pasang dependensi jika proyek menggunakan composer
            if [ -f composer.json ]; then
                COMPOSER_PROCESS_TIMEOUT=2000 php8.3 $(which composer) install --prefer-source --no-dev --optimize-autoloader --no-interaction
            fi

            # 3. Terapkan izin file/folder standar (lewati storage, uploads, dan vendor)
            find . -path './storage' -prune -o -path './uploads' -prune -o -path './public/uploads' -prune -o -path './vendor' -prune -o -type d -exec chmod 755 {} +
            find . -path './storage' -prune -o -path './uploads' -prune -o -path './public/uploads' -prune -o -path './vendor' -prune -o -type f -exec chmod 644 {} +

            # 4. Kunci file konfigurasi environment
            if [ -f .env ]; then
                chmod 640 .env
            fi
            if [ -f config.php ]; then
                chmod 640 config.php
            fi

            # 5. Amankan izin folder runtime dan uploads
            for dir in storage uploads public/uploads temp sessions; do
                if [ -d "$dir" ]; then
                    sudo chown -R labfikom:www-data "$dir"
                    sudo chmod -R ug+rwX "$dir"
                fi
            done

      - name: Send Telegram Notification (Success)
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_USER: ${{ github.event.head_commit.author.username }}
          MERGED_BY: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | sed 's/[<>&]//g')
          FINAL_AUTHOR="${AUTHOR_NAME:-$AUTHOR_USER}"
          [ -z "$FINAL_AUTHOR" ] && FINAL_AUTHOR="$MERGED_BY"

          MESSAGE="🚀 <b>ICLABS-PRAKTIKUM [PRODUCTION] Berhasil!</b>%0A%0A"
          MESSAGE+="<b>Branch:</b> <code>main</code>%0A"
          MESSAGE+="<b>Commit:</b> <code>${COMMIT_SHA:0:7}</code>%0A"
          MESSAGE+="<b>Author (Pembuat):</b> ${FINAL_AUTHOR}%0A"
          MESSAGE+="<b>Merged / Pemicu:</b> ${MERGED_BY}%0A"
          MESSAGE+="<b>Pesan:</b> ${CLEAN_MSG}%0A"
          MESSAGE+="<b>Status:</b> ✅ Berhasil di-deploy dari branch main."

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"

      - name: Send Telegram Notification (Failure)
        if: failure()
        env:
          MERGED_BY: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          MESSAGE="❌ <b>ICLABS-PRAKTIKUM [PRODUCTION] GAGAL!</b>%0A%0A"
          MESSAGE+="<b>Branch:</b> <code>main</code>%0A"
          MESSAGE+="<b>Commit:</b> <code>${COMMIT_SHA:0:7}</code>%0A"
          MESSAGE+="<b>Pemicu:</b> ${MERGED_BY}%0A"
          MESSAGE+="<b>Status:</b> Gagal mengeksekusi deployment production. Cek log Actions."

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"